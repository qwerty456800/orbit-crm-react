# Render Blueprint for the Orbit API (free web service).
# Secrets (DATABASE_URL, CORS_ORIGIN) are entered in the Render dashboard.
services:
  - type: web
    name: orbit-crm-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev
    # Applies schema.sql (idempotent) on every start, then runs the API.
    startCommand: npm run db:migrate && npm run server:start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
